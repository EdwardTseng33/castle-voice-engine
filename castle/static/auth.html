<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>蘇菲</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #000;
      --fg: rgba(255, 255, 255, 0.95);
      --fg-fade: rgba(255, 255, 255, 0.28);
      --red: #e3392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang TC",
                   "Noto Sans TC", sans-serif;
      font-feature-settings: "ss01", "cv11";
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 24px;
    }
    .name {
      font-family: "Georgia", "Source Han Serif TC", serif;
      font-style: italic;
      font-size: 56px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: var(--fg);
    }
    .err {
      color: var(--red);
      font-size: 13px;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.3s ease;
      text-align: center;
      max-width: 340px;
      white-space: pre-line;
      line-height: 1.55;
    }
    .err.show { opacity: 1; }
    .loading {
      color: var(--fg-fade);
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .loading.show { opacity: 1; }
    .footer {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: var(--fg-fade);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="name">蘇菲</div>

    <div id="g_id_onload"
         data-client_id="870408555328-dv80l5gs73os63r44e8ed79kndcoorbm.apps.googleusercontent.com"
         data-callback="onSignIn"
         data-auto_prompt="false"
         data-context="signin"></div>
    <div class="g_id_signin"
         data-type="standard"
         data-shape="pill"
         data-theme="filled_black"
         data-text="signin_with"
         data-size="large"
         data-locale="zh_TW"
         data-logo_alignment="left"></div>

    <div class="loading" id="loading">驗證中…</div>
    <div class="err" id="err"></div>
  </div>

  <div class="footer">POWERED BY 城堡</div>

  <script>
    function safeStr(v) {
      if (v == null) return "";
      if (typeof v === "string") return v;
      try { return String(v); } catch (e) { return ""; }
    }

    function showErr(text) {
      var loading = document.getElementById("loading");
      var err = document.getElementById("err");
      loading.classList.remove("show");
      err.textContent = safeStr(text) || "登入失敗 · 請重試";
      err.classList.add("show");
    }

    function onSignIn(response) {
      var loading = document.getElementById("loading");
      var err = document.getElementById("err");
      err.classList.remove("show");
      loading.classList.add("show");

      fetch("/auth/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: response.credential }),
        credentials: "include"
      })
        .then(function (r) {
          if (r.ok) {
            return r.json().then(function () {
              location.href = "/static/index.html";
            });
          }
          return r.json().then(function (j) {
            var detail = safeStr(j && j.detail) || "登入失敗";
            var contact = safeStr(j && j.contact);
            var yourEmail = safeStr(j && j.your_email);
            var msg = detail;
            if (contact) {
              msg = detail + "\n\n" +
                    (yourEmail ? "您的帳號 " + yourEmail + "\n" : "") +
                    "請聯絡 " + contact + " 開放";
            }
            showErr(msg);
          }).catch(function () {
            showErr("登入失敗 · 請重試");
          });
        })
        .catch(function (e) {
          showErr("網路錯誤 · " + safeStr(e && e.message));
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (document.cookie.indexOf("sophie_auth=") !== -1) {
        fetch("/auth/whoami", { credentials: "include" })
          .then(function (r) { if (r.ok) location.href = "/static/index.html"; })
          .catch(function () {});
      }
    });
  </script>
</body>
</html>
