<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Compositor Isolated Test</title>
  <style>
    body { font-family: ui-monospace, Menlo, Consolas, monospace; background:#0a0a14; color:#cfd5e6; margin:0; padding:16px; }
    h1 { color:#fff; font-size:14px; margin:0 0 12px; }
    .row { display:flex; gap:16px; align-items:flex-start; }
    #liveVideo { width:240px; height:320px; background:#000; border:1px solid #224; border-radius:6px; object-fit:cover; }
    #log { flex:1; background:#000; border:1px solid #224; border-radius:6px; padding:8px; height:520px; overflow:auto; font-size:11px; line-height:1.5; }
    .btn { display:inline-block; padding:6px 12px; margin:4px; background:#234; color:#cfd5e6; border:1px solid #345; border-radius:4px; cursor:pointer; font:11px ui-monospace, monospace; }
    .btn:hover { background:#345; }
    .test { padding:6px; margin:4px 0; border-radius:3px; }
    .pass { background:#1a3a1a; color:#9fda9f; }
    .fail { background:#3a1a1a; color:#da9f9f; }
    .info { background:#1a1a3a; color:#9f9fda; }
  </style>
</head>
<body>
  <h1>Avatar Compositor V1 Isolated Test</h1>
  <div class="row">
    <video id="liveVideo" muted autoplay playsinline></video>
    <div style="flex:1">
      <div>
        <button class="btn" data-action="run-all">Run all tests</button>
        <button class="btn" data-action="play-speaking">play_speaking</button>
        <button class="btn" data-action="play-idle">play_idle</button>
        <button class="btn" data-action="play-lipsync">play_lipsync (sophie-acknowledgement)</button>
        <button class="btn" data-action="speech-speaking">speech_state speaking</button>
        <button class="btn" data-action="speech-idle">speech_state idle</button>
        <button class="btn" data-action="try-direct-src">Try direct v.src write</button>
        <button class="btn" data-action="reset-stats">Reset stats</button>
      </div>
      <div id="results"></div>
      <div id="log"></div>
    </div>
  </div>

  <script src="/static/avatar-compositor.js?v=2.x"></script>
  <script src="/static/speech-state.js?v=2.x"></script>
  <script src="/static/debug-panel.js?v=2.x"></script>

  <script>
  (function () {
    var liveVideo = document.getElementById("liveVideo");
    var logEl = document.getElementById("log");
    var resultsEl = document.getElementById("results");

    function log(msg) {
      var line = document.createElement("div");
      var ts = new Date().toISOString().substring(11, 19);
      line.textContent = "[" + ts + "] " + msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }
    window.__testLog = log;

    var compositor = new AvatarCompositor(liveVideo, {
      log: log,
      defaultIdleSrc: "/static/sophie-idle.mp4",
      defaultSpeakingSrc: "/static/sophie-speaking.mp4"
    });
    var reducer = new SpeechStateReducer(compositor, { log: log });
    var panel = new AvatarDebugPanel(compositor, reducer, { log: log });
    window.__sophieAvatarCompositor = compositor;
    window.__sophieSpeechState = reducer;
    window.__sophieDebugPanel = panel;

    function result(name, pass, detail) {
      var div = document.createElement("div");
      div.className = "test " + (pass ? "pass" : "fail");
      div.textContent = (pass ? "[PASS] " : "[FAIL] ") + name + (detail ? " - " + detail : "");
      resultsEl.appendChild(div);
      log((pass ? "[PASS] " : "[FAIL] ") + name);
    }

    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    async function runAll() {
      resultsEl.innerHTML = "";
      log("=== Run all tests ===");

      var s = compositor.getState();
      result("T1: compositor.getState()", s.mode === "idle" && s.priority === 0, JSON.stringify(s));

      compositor.dispatch({ type: "play_idle", src: "/static/sophie-idle.mp4", owner: "T2" });
      await sleep(200);
      result("T2: play_idle dispatch", compositor.getState().mode === "idle");

      var before = compositor.getState().srcSwitchCount;
      compositor.dispatch({ type: "play_speaking", src: "/static/sophie-speaking.mp4", owner: "T3" });
      await sleep(300);
      var afterState = compositor.getState();
      result("T3: play_speaking dispatch + src switch", afterState.mode === "speaking" && afterState.srcSwitchCount === before + 1, "switches: " + afterState.srcSwitchCount);

      var beforeNoop = compositor.getState().srcSwitchCount;
      compositor.dispatch({ type: "play_speaking", src: "/static/sophie-speaking.mp4", owner: "T4-dup" });
      compositor.dispatch({ type: "play_speaking", src: "/static/sophie-speaking.mp4", owner: "T4-dup-2" });
      await sleep(100);
      var afterNoop = compositor.getState().srcSwitchCount;
      result("T4: noop on same intent (no flicker)", afterNoop === beforeNoop, "switches before=" + beforeNoop + " after=" + afterNoop);

      compositor.dispatch({ type: "play_lipsync_cached", src: "/static/sophie-acknowledgement.mp4", owner: "T5-lipsync" });
      await sleep(100);
      var beforeReject = compositor.getState().rejectedIntents;
      compositor.dispatch({ type: "play_speaking", src: "/static/sophie-speaking.mp4", owner: "T5-attack" });
      await sleep(100);
      var afterReject = compositor.getState().rejectedIntents;
      result("T5: lipsync priority blocks lower-priority intent", afterReject > beforeReject, "rejected before=" + beforeReject + " after=" + afterReject);

      await sleep(3500);
      compositor.forceReset("T6-pre-reset");

      reducer.force("idle", "T6-reset");
      await sleep(200);
      compositor.dispatch({ type: "play_idle", src: "/static/sophie-idle.mp4", owner: "T6-idle" });
      await sleep(200);
      var beforeT6 = compositor.getState().srcSwitchCount;
      compositor.dispatch({ type: "speech_state", state: "speaking", sid: "test-sid-1" });
      await sleep(300);
      var t6State = compositor.getState();
      result("T6: speech_state speaking -> speaking fallback", t6State.mode === "speaking" && t6State.srcSwitchCount === beforeT6 + 1, "mode=" + t6State.mode);

      var beforeT7 = compositor.getState().srcSwitchCount;
      compositor.dispatch({ type: "speech_state", state: "idle", sid: "test-sid-1" });
      await sleep(300);
      var t7State = compositor.getState();
      result("T7: speech_state idle -> idle src", t7State.mode === "idle" && t7State.srcSwitchCount === beforeT7 + 1, "mode=" + t7State.mode);

      compositor.forceReset("T8-pre-reset");
      reducer.force("idle", "T8-reset");
      await sleep(200);
      reducer.handleOpenAIEvent({ type: "response.created", response: { id: "r-test-1" } });
      await sleep(100);
      var t8a = reducer.getState();
      result("T8a: response.created -> thinking", t8a.state === "thinking");

      reducer.handleOpenAIEvent({ type: "response.audio.delta" });
      await sleep(200);
      var t8b = reducer.getState();
      var t8bComp = compositor.getState();
      result("T8b: audio.delta -> speaking + compositor speaking", t8b.state === "speaking" && t8bComp.mode === "speaking");

      reducer.handleOpenAIEvent({ type: "response.audio.done" });
      await sleep(300);
      var t8c = reducer.getState();
      var t8cComp = compositor.getState();
      result("T8c: audio.done -> idle", t8c.state === "idle" && t8cComp.mode === "idle");

      var beforeT9 = compositor.getState().rejectedIntents;
      compositor.dispatch(null);
      compositor.dispatch({});
      compositor.dispatch({ type: "nonsense", src: "/foo.mp4" });
      compositor.dispatch({ type: "play_speaking" });
      var afterT9 = compositor.getState().rejectedIntents;
      result("T9: invalid intents rejected", afterT9 >= beforeT9 + 4, "rejected delta=" + (afterT9 - beforeT9));

      compositor.registerCachedLipsync("sid-cached-1", "/static/sophie-greeting.mp4");
      result("T10a: registerCachedLipsync", compositor.getCachedLipsync("sid-cached-1") === "/static/sophie-greeting.mp4");
      var beforeT10b = compositor.getState().srcSwitchCount;
      compositor.dispatch({ type: "speech_state", state: "speaking", sid: "sid-cached-1" });
      await sleep(300);
      var t10b = compositor.getState();
      result("T10b: cached sid -> lipsync_cached mode", t10b.mode === "lipsync_cached" && t10b.srcSwitchCount === beforeT10b + 1, "mode=" + t10b.mode);

      await sleep(3500);
      var stats = compositor.getState();
      log("=== Final stats: " + JSON.stringify(stats) + " ===");
    }

    document.addEventListener("click", function (e) {
      var t = e.target;
      if (!t || !t.dataset || !t.dataset.action) return;
      var a = t.dataset.action;
      if (a === "run-all") runAll();
      else if (a === "play-speaking") compositor.dispatch({ type: "play_speaking", src: "/static/sophie-speaking.mp4", owner: "manual" });
      else if (a === "play-idle") compositor.dispatch({ type: "play_idle", src: "/static/sophie-idle.mp4", owner: "manual" });
      else if (a === "play-lipsync") compositor.dispatch({ type: "play_lipsync_cached", src: "/static/sophie-acknowledgement.mp4", owner: "manual" });
      else if (a === "speech-speaking") compositor.dispatch({ type: "speech_state", state: "speaking", sid: "manual-sid" });
      else if (a === "speech-idle") compositor.dispatch({ type: "speech_state", state: "idle" });
      else if (a === "try-direct-src") {
        try {
          liveVideo.src = "/static/sophie-task-handoff.mp4";
          log("[GUARD-TEST] direct src write set (default tolerant mode)");
        } catch (err) { log("[GUARD-TEST] error: " + err.message); }
      }
      else if (a === "reset-stats") {
        compositor.stats = new (compositor.stats.constructor)();
        resultsEl.innerHTML = "";
        log("stats reset");
      }
    });

    log("test page ready - click Run all tests");
  })();
  </script>
</body>
</html>
