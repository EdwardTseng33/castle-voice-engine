<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蘇菲 · v0.4.2</title>
  <style>
    :root {
      --amber: #D4712A;
      --amber-deep: #A4571F;
      --amber-bright: #FFB570;
      --green: #1fa66e;
      --green-deep: #15875a;
      --err: #e3392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Source Han Serif TC", "Noto Serif TC", serif;
      color: white;
    }

    .shell {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a120c 0%, #050302 70%);
      display: flex;
      flex-direction: column;
    }

    /* === Top overlay === */
    .top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .name-block {
      display: flex; align-items: center; gap: 10px;
      pointer-events: auto;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }
    .name {
      font-style: italic;
      font-size: 18px;
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.3px;
    }
    .info-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.45);
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      font-family: Georgia, serif;
      font-style: normal;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: help;
    }
    .top-right { display: flex; gap: 10px; pointer-events: auto; }
    .settings-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-btn:hover { background: rgba(255,255,255,0.16); }

    /* === Center === */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 80px 24px;
      text-align: center;
    }
    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); opacity: 0.92; box-shadow: 0 0 60px rgba(212,113,42,0.35); }
      50%      { transform: scale(1.06); opacity: 1;    box-shadow: 0 0 90px rgba(212,113,42,0.55); }
    }
    .orb {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, var(--amber-bright), var(--amber) 55%, var(--amber-deep) 100%);
      animation: orb-pulse 2.8s ease-in-out infinite;
    }
    .greeting {
      font-style: italic;
      font-size: 26px;
      color: rgba(255,255,255,0.94);
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      max-width: 600px;
      line-height: 1.45;
    }
    .lead {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      max-width: 520px;
    }
    .start-btn {
      padding: 16px 38px;
      border-radius: 999px;
      border: 0;
      background: var(--green);
      color: white;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(31, 166, 110, 0.45);
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .start-btn:hover {
      background: var(--green-deep);
      transform: translateY(-1px);
      box-shadow: 0 10px 32px rgba(31, 166, 110, 0.55);
    }
    .start-btn:active { transform: scale(0.97); }
    .start-btn:disabled {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.45);
      cursor: not-allowed;
      box-shadow: none;
    }
    .shell.active .start-btn { display: none; }

    /* === Active state · 對話進行中 === */
    .active-block {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .shell.active .active-block { display: flex; }
    .shell.active .greeting { font-size: 22px; }
    .shell.active .orb { width: 140px; height: 140px; }
    .active-status {
      font-size: 14px;
      color: var(--amber-bright);
      letter-spacing: 0.5px;
    }
    .active-hint {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      max-width: 480px;
    }
    .end-btn {
      padding: 14px 32px;
      border-radius: 999px;
      border: 0;
      background: var(--err);
      color: white;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(227, 57, 43, 0.4);
      transition: background 0.15s, transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .end-btn:hover { background: #c12d22; transform: translateY(-1px); }
    .end-btn:active { transform: scale(0.97); }
    .end-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* === Error === */
    .error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      max-width: 540px;
      background: rgba(212,113,42,0.1);
      border: 1px solid rgba(212,113,42,0.35);
      border-radius: 10px;
    }
    .error.show { display: flex; }
    .error-title {
      font-style: italic;
      font-size: 16px;
      color: rgba(255,255,255,0.92);
    }
    .error-detail {
      font-size: 12px;
      color: rgba(255,180,112,0.85);
      line-height: 1.55;
    }

    /* === Bottom overlay === */
    .bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }
    .timer {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, "Cascadia Code", monospace;
      pointer-events: auto;
      min-width: 60px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .shell.active .timer { opacity: 1; }
    .watermark {
      color: rgba(255,255,255,0.32);
      font-size: 11px;
      letter-spacing: 0.5px;
      pointer-events: auto;
      min-width: 60px;
      text-align: right;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }
    .bottom-spacer { min-width: 60px; }

    /* === Settings panel === */
    .panel {
      position: absolute;
      top: 0; right: 0;
      width: 320px;
      height: 100%;
      background: rgba(20, 14, 8, 0.96);
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 64px 24px 24px;
      transform: translateX(100%);
      transition: transform 0.25s;
      z-index: 50;
      overflow-y: auto;
    }
    .panel.open { transform: translateX(0); }
    .panel h3 {
      font-style: italic;
      font-size: 18px;
      color: var(--amber-bright);
      margin-bottom: 18px;
      font-weight: normal;
    }
    .privacy-note {
      font-size: 12px;
      color: rgba(255,180,112,0.85);
      line-height: 1.7;
      padding: 14px;
      background: rgba(212,113,42,0.12);
      border: 1px solid rgba(212,113,42,0.32);
      border-radius: 8px;
    }
    .panel-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 30px; height: 30px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      font-size: 18px;
    }
    .panel-close:hover { background: rgba(255,255,255,0.18); }
    .log-toggle {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.62);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      margin-top: 18px;
    }
    .log {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.6);
      color: #d4c4a8;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }
    .log.open { display: block; }

    @media (max-width: 767px) {
      .orb { width: 140px; height: 140px; }
      .shell.active .orb { width: 110px; height: 110px; }
      .greeting { font-size: 22px; }
      .top, .bottom { padding: 16px 18px; }
      .panel { width: 100%; }
      .start-btn { font-size: 15px; padding: 14px 28px; }
    }
  </style>
</head>
<body>

  <div class="shell" id="shell">

    <div class="top">
      <div class="name-block">
        <span class="name">蘇菲</span>
        <span class="info-dot" title="Voice Path v0.4.2 · 雲端真人對話 · 不錄影 · 不存盤">i</span>
      </div>
      <div class="top-right">
        <button class="settings-btn" id="settingsBtn" title="設定">⚙</button>
      </div>
    </div>

    <div class="center">
      <div class="orb"></div>

      <!-- Idle state -->
      <div class="idle-block" id="idleBlock">
        <div class="greeting">今天想跟蘇菲聊什麼？</div>
        <p class="lead">按下方按鈕、蘇菲會在新視窗開啟<br>輸入名字 → 點 Continue → 講話就可以</p>
        <br>
        <button class="start-btn" id="startBtn">
          <span>📞</span>
          <span>開始跟蘇菲對話</span>
        </button>
        <div class="error" id="errorBox">
          <div class="error-title" id="errorTitle">啟動失敗</div>
          <div class="error-detail" id="errorDetail"></div>
        </div>
      </div>

      <!-- Active state -->
      <div class="active-block">
        <div class="active-status">● 對話進行中（新視窗）</div>
        <p class="active-hint">蘇菲在另一個視窗跟你聊<br>講完後關掉那個視窗、回來這裡按結束</p>
        <br>
        <button class="end-btn" id="endBtn">
          <span>✕</span>
          <span>結束對話 + 停止計費</span>
        </button>
      </div>
    </div>

    <div class="bottom">
      <div class="timer" id="timer">00:00</div>
      <div class="bottom-spacer"></div>
      <div class="watermark">城堡 · BeyondPath</div>
    </div>

    <div class="panel" id="panel">
      <button class="panel-close" id="panelClose">✕</button>
      <h3>蘇菲 · 設定</h3>
      <div class="privacy-note">
        🔒 鏡頭 / 麥克風只在對話視窗、不存盤、不錄影、不外傳。<br><br>
        對話結束後、雲端不留檔。<br><br>
        Sally 6 歲不會被叫出來——城堡守則寫在後台。
      </div>
      <button class="log-toggle" id="logToggle">▾ 開發者 log</button>
      <div class="log" id="log"></div>
    </div>

  </div>

<script>
(function () {
  const shell = document.getElementById("shell");
  const startBtn = document.getElementById("startBtn");
  const endBtn = document.getElementById("endBtn");
  const errorBox = document.getElementById("errorBox");
  const errorTitle = document.getElementById("errorTitle");
  const errorDetail = document.getElementById("errorDetail");
  const timerEl = document.getElementById("timer");
  const settingsBtn = document.getElementById("settingsBtn");
  const panel = document.getElementById("panel");
  const panelClose = document.getElementById("panelClose");
  const logEl = document.getElementById("log");
  const logToggle = document.getElementById("logToggle");

  let conversationId = null;
  let conversationWin = null;
  let startedAt = 0;
  let timerInterval = null;

  function log(msg) {
    const ts = new Date().toLocaleTimeString();
    logEl.textContent += "[" + ts + "] " + msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
  logToggle.addEventListener("click", () => {
    logEl.classList.toggle("open");
    logToggle.textContent = logEl.classList.contains("open") ? "▴ 折疊 log" : "▾ 開發者 log";
  });
  settingsBtn.addEventListener("click", () => panel.classList.add("open"));
  panelClose.addEventListener("click", () => panel.classList.remove("open"));

  function updateTimer() {
    if (!startedAt) return;
    const e = Math.floor((Date.now() - startedAt) / 1000);
    timerEl.textContent = String(Math.floor(e/60)).padStart(2,"0") + ":" + String(e%60).padStart(2,"0");
  }
  function showError(title, detail) {
    errorTitle.textContent = title;
    errorDetail.textContent = detail || "";
    errorBox.classList.add("show");
  }
  function clearError() { errorBox.classList.remove("show"); }

  async function startConversation() {
    if (conversationId) return;
    startBtn.disabled = true;
    clearError();
    log("建立對話...");

    let resp, data;
    try {
      resp = await fetch("/tavus/conversation/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ audio_only: false }),
      });
      data = await resp.json();
    } catch (e) {
      startBtn.disabled = false;
      showError("連不到伺服器", e.message);
      return;
    }
    if (!resp.ok || !data.ok) {
      startBtn.disabled = false;
      showError("啟動失敗", (data && (data.hint || data.detail)) || ("HTTP " + resp.status));
      return;
    }
    conversationId = data.conversation_id;
    log("conversation " + conversationId);

    // 新分頁開 daily URL (避開 iframe X-Frame block)
    conversationWin = window.open(data.conversation_url, "_blank");
    if (!conversationWin) {
      // 彈窗被擋
      startBtn.disabled = false;
      showError("彈窗被擋", "瀏覽器擋了新視窗、請允許後再試一次。或手動開: " + data.conversation_url);
      // 自動結束、不繼續燒
      try { await fetch(`/tavus/conversation/${conversationId}/end`, { method: "POST" }); } catch (_) {}
      conversationId = null;
      return;
    }

    shell.classList.add("active");
    startedAt = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
    startBtn.disabled = false;
  }

  async function endConversation() {
    endBtn.disabled = true;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (conversationId) {
      log("結束 " + conversationId);
      try {
        await fetch(`/tavus/conversation/${conversationId}/end`, { method: "POST" });
      } catch (e) { log("end err: " + e.message); }
      conversationId = null;
    }
    if (conversationWin && !conversationWin.closed) {
      try { conversationWin.close(); } catch (_) {}
    }
    location.reload();
  }

  startBtn.addEventListener("click", startConversation);
  endBtn.addEventListener("click", endConversation);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (panel.classList.contains("open")) panel.classList.remove("open");
      else if (conversationId) endConversation();
    }
  });

  window.addEventListener("beforeunload", () => {
    if (conversationId) {
      navigator.sendBeacon(`/tavus/conversation/${conversationId}/end`, "");
    }
  });

  log("Voice Path v0.4.2 ready · 新視窗模式 · 避開 iframe X-Frame block");
})();
</script>
</body>
</html>
