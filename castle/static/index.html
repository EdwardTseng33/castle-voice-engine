<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>蘇菲</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="蘇菲" />
  <link rel="apple-touch-icon" href="/static/sophie-portrait.png" />
  <style>
    :root {
      --bg: #000;
      --fg: rgba(255, 255, 255, 0.95);
      --fg-dim: rgba(255, 255, 255, 0.55);
      --fg-fade: rgba(255, 255, 255, 0.22);
      --line: rgba(255, 255, 255, 0.18);
      --green: #1fa66e;
      --green-deep: #15875a;
      --red: #e3392b;
      --red-deep: #c12d22;
      --motion-fast: 120ms;
      --motion-normal: 280ms;
      --motion-smooth: 400ms;
      --easing: cubic-bezier(0.4, 0, 0.2, 1);
      --safe-top: max(20px, env(safe-area-inset-top));
      --safe-bottom: max(20px, env(safe-area-inset-bottom));
      --safe-left: max(20px, env(safe-area-inset-left));
      --safe-right: max(20px, env(safe-area-inset-right));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Georgia, "Source Han Serif TC", "Noto Serif TC", serif;
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .live-audio { display: none; }
    .top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: var(--safe-top) var(--safe-right) 16px var(--safe-left);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .name-block {
      display: flex; align-items: center; gap: 10px;
      pointer-events: auto;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
    }
    .name {
      font-style: italic;
      font-size: 18px;
      color: var(--fg);
      letter-spacing: 0.3px;
    }
    .info-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--fg-dim);
      font: italic 11px Georgia, serif;
      cursor: help;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .stage-canvas {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      opacity: 0;
      transition: opacity var(--motion-smooth) var(--easing);
    }
    .shell[data-state="hibernate"] .portrait,
    .shell[data-state="waking"] .portrait,
    .shell[data-state="semi-idle"] .portrait { opacity: 1; }
    .live-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--bg);
      opacity: 0;
      transition: opacity var(--motion-smooth) var(--easing);
    }
    .shell[data-state="pre-call"] .live-video,
    .shell[data-state="in-call"] .live-video,
    .shell[data-state="soft-prompt"] .live-video { opacity: 1; }
    .shell[data-state="pre-call"]:not([data-stream-ready="1"]) .portrait { opacity: 1; }
    .shell[data-state="pre-call"]:not([data-stream-ready="1"]) .live-video { opacity: 0; }
    .waking-spinner {
      position: absolute;
      width: 32px; height: 32px;
      border: 2px solid var(--fg-fade);
      border-top-color: var(--fg);
      border-radius: 50%;
      bottom: 25%;
      left: 50%; transform: translateX(-50%);
      opacity: 0;
      animation: spin 0.9s linear infinite;
      transition: opacity var(--motion-fast) var(--easing);
    }
    .shell[data-state="waking"] .waking-spinner { opacity: 1; }
    @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
    .waking-label {
      position: absolute;
      bottom: calc(25% - 48px);
      left: 50%; transform: translateX(-50%);
      font-style: italic;
      font-size: 14px;
      color: var(--fg-dim);
      letter-spacing: 0.5px;
      opacity: 0;
      transition: opacity var(--motion-fast) var(--easing);
    }
    .shell[data-state="waking"] .waking-label { opacity: 1; }
    .soft-caption {
      position: absolute;
      bottom: 25%;
      left: 50%; transform: translateX(-50%);
      font-style: italic;
      font-size: 16px;
      color: var(--fg);
      letter-spacing: 0.3px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transition: opacity var(--motion-smooth) var(--easing);
      pointer-events: none;
    }
    .shell[data-state="soft-prompt"] .soft-caption { opacity: 1; }
    .bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px var(--safe-right) var(--safe-bottom) var(--safe-left);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      z-index: 20;
      pointer-events: none;
    }
    .timer {
      justify-self: start;
      align-self: center;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
      color: var(--fg);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transition: opacity var(--motion-normal) var(--easing);
      pointer-events: auto;
    }
    .shell[data-state="in-call"] .timer,
    .shell[data-state="soft-prompt"] .timer { opacity: 1; }
    .watermark {
      justify-self: end;
      align-self: center;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--fg-fade);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      pointer-events: auto;
    }
    .demo-disclaimer {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 68px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--fg-fade);
      font-style: italic;
      letter-spacing: 0.3px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      opacity: 0;
      transition: opacity var(--motion-smooth) var(--easing);
      pointer-events: none;
      z-index: 25;
      text-align: center;
      max-width: 80%;
    }
    .shell[data-state="in-call"] .demo-disclaimer,
    .shell[data-state="soft-prompt"] .demo-disclaimer { opacity: 0.55; }
    .actions {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }
    .action-btn {
      display: none;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      color: var(--fg);
      transition: background var(--motion-fast) var(--easing),
                  transform var(--motion-fast) var(--easing),
                  box-shadow var(--motion-fast) var(--easing);
    }
    .action-btn:active { transform: scale(0.94); }
    .action-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .action-btn.start {
      background: var(--green);
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 8px 28px rgba(31, 166, 110, 0.45);
      align-items: center;
      gap: 10px;
    }
    .action-btn.start:hover {
      background: var(--green-deep);
      box-shadow: 0 10px 32px rgba(31, 166, 110, 0.55);
    }
    .shell[data-state="pre-call"] .action-btn.start { display: inline-flex; }
    .action-btn.mic, .action-btn.cam, .action-btn.end {
      width: 56px; height: 56px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 20px;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
    }
    .action-btn.mic:hover, .action-btn.cam:hover { background: rgba(255, 255, 255, 0.22); }
    .action-btn.mic.off, .action-btn.cam.off { background: rgba(227, 57, 43, 0.32); }
    .action-btn.end { background: var(--red); box-shadow: 0 4px 18px rgba(227, 57, 43, 0.45); }
    .action-btn.end:hover { background: var(--red-deep); }
    .shell[data-state="in-call"] .action-btn.mic,
    .shell[data-state="in-call"] .action-btn.cam,
    .shell[data-state="in-call"] .action-btn.end,
    .shell[data-state="soft-prompt"] .action-btn.mic,
    .shell[data-state="soft-prompt"] .action-btn.cam,
    .shell[data-state="soft-prompt"] .action-btn.end { display: inline-flex; }
    .action-btn.pip { width: 44px; height: 44px; background: rgba(255, 255, 255, 0.10); font-size: 16px; align-items: center; justify-content: center; }
    .shell[data-state="in-call"] .action-btn.pip { display: inline-flex; }
    @media (max-width: 767px) { .action-btn.pip { display: none !important; } }
    .hint-text { font-style: italic; font-size: 14px; color: var(--fg-dim); letter-spacing: 0.3px; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); animation: breath 4s ease-in-out infinite; display: none; }
    .shell[data-state="hibernate"] .hint-text,
    .shell[data-state="semi-idle"] .hint-text { display: inline; }
    @keyframes breath { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    .err-bar { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); max-width: 80%; padding: 12px 18px; background: rgba(227, 57, 43, 0.85); color: white; font-size: 13px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4); display: none; z-index: 30; pointer-events: auto; text-align: center; }
    .err-bar.show { display: block; }
    .log { position: absolute; right: 12px; top: 64px; width: 260px; max-height: 240px; padding: 10px 12px; background: rgba(0, 0, 0, 0.85); color: rgba(255, 255, 255, 0.78); font-family: ui-monospace, monospace; font-size: 10px; border: 1px solid var(--line); border-radius: 6px; overflow-y: auto; white-space: pre-wrap; display: none; z-index: 25; pointer-events: auto; }
    .log.open { display: block; }
    .action-btn:focus-visible, .info-dot:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .hint-text { animation: none; opacity: 0.65; }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .name { font-size: 20px; }
      .action-btn.start { font-size: 17px; padding: 16px 32px; }
      .action-btn.mic, .action-btn.cam, .action-btn.end { width: 60px; height: 60px; font-size: 22px; }
      .actions { gap: 20px; }
    }
    @media (min-width: 1024px) and (max-width: 1599px) {
      .name { font-size: 18px; }
      .actions { gap: 18px; }
    }
    @media (min-width: 1600px) {
      .name { font-size: 20px; }
      .top, .bottom { padding-inline: 40px; }
      .action-btn.start { font-size: 18px; padding: 18px 40px; }
      .actions { gap: 24px; }
    }
    @media (max-width: 393px) and (orientation: portrait) {
      .name { font-size: 17px; }
      .action-btn.start { padding: 12px 24px; font-size: 15px; }
      .action-btn.mic, .action-btn.cam, .action-btn.end { width: 52px; height: 52px; font-size: 18px; }
      .actions { gap: 12px; }
    }
    @media (min-width: 394px) and (max-width: 440px) and (orientation: portrait) {
      .action-btn.mic, .action-btn.cam, .action-btn.end { width: 56px; height: 56px; }
    }
    @supports (padding-top: env(safe-area-inset-top)) {
      .top { padding-top: max(env(safe-area-inset-top), 24px); }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .name { font-size: 16px; }
      .action-btn.start { padding: 10px 22px; font-size: 14px; }
      .action-btn.mic, .action-btn.cam, .action-btn.end { width: 46px; height: 46px; font-size: 17px; }
      .top, .bottom { padding-block: 10px; }
    }
    /* v0.7.1 hotfix: 9:16 mobile fullscreen Duix Lily 範式 */
    @media (orientation: portrait) and (max-width: 600px) {
      html, body { height: 100dvh; }
      .shell { width: 100vw; height: 100dvh; }
      .portrait, .live-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }
      .stage-canvas { flex: 1; min-height: 0; }
      .top { padding-top: max(env(safe-area-inset-top), 16px); }
      .bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
      .demo-disclaimer {
        bottom: calc(max(env(safe-area-inset-bottom), 16px) + 88px);
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="shell" id="shell" data-state="hibernate" data-stream-ready="0">

    <header class="top">
      <div class="name-block">
        <span class="name">蘇菲</span>
        <button class="info-dot" id="infoBtn" aria-label="關於蘇菲">i</button>
      </div>
    </header>

    <main class="stage-canvas">
      <img class="portrait" id="portrait" src="/static/sophie-portrait.png" alt="" />
      <video class="live-video" id="liveVideo" autoplay playsinline muted loop preload="auto" poster="/static/sophie-portrait.png"></video>
      <audio class="live-audio" id="liveAudio" autoplay playsinline></audio>

      <div class="waking-spinner" aria-hidden="true"></div>
      <div class="waking-label">準備中</div>
      <div class="soft-caption">我在這、有事再叫</div>
      <div class="demo-disclaimer" id="demoDisclaimer">即時嘴對齊預覽 · 視覺示意（Phase 7c 待真實串流）· 音訊為 OpenAI Realtime 即時對話</div>

      <div class="err-bar" id="errBar" role="alert"></div>
      <div class="log" id="log" aria-hidden="true"></div>
    </main>

    <footer class="bottom">
      <span class="timer" id="timer">00:00</span>

      <div class="actions">
        <button class="action-btn start" id="startBtn" aria-label="開始視訊對話">
          <span aria-hidden="true">📞</span>
          <span>Start video chat</span>
        </button>

        <button class="action-btn mic" id="micBtn" aria-label="麥克風" aria-pressed="true">🎙</button>
        <button class="action-btn cam" id="camBtn" aria-label="鏡頭" aria-pressed="true">📷</button>
        <button class="action-btn pip" id="pipBtn" aria-label="浮窗模式">⛶</button>
        <button class="action-btn end" id="endBtn" aria-label="結束對話">●</button>

        <span class="hint-text">叫我或對我看一眼就會醒</span>
      </div>

      <span class="watermark">Powered by 城堡</span>
    </footer>

  </div>

  <script src="/static/voice-lifecycle.js"></script>
  <script>
  (function () {
    "use strict";

    var shell = document.getElementById("shell");
    var infoBtn = document.getElementById("infoBtn");
    var startBtn = document.getElementById("startBtn");
    var micBtn = document.getElementById("micBtn");
    var camBtn = document.getElementById("camBtn");
    var pipBtn = document.getElementById("pipBtn");
    var endBtn = document.getElementById("endBtn");
    var timerEl = document.getElementById("timer");
    var liveVideo = document.getElementById("liveVideo");
    var liveAudio = document.getElementById("liveAudio");
    var errBar = document.getElementById("errBar");
    var logEl = document.getElementById("log");

    var lifecycle = new window.VoiceLifecycle({
      shell: shell,
      onTransition: function (oldS, newS) {
        log("state: " + oldS + " -> " + newS);
        if (newS === "in-call") startTimer();
        if (oldS === "in-call" || oldS === "soft-prompt") stopTimer();
      }
    });
    lifecycle.start();

    var peerConn = null;
    var localStream = null;
    var startedAtMs = 0;
    var timerIntervalId = null;
    var micOn = true;
    var camOn = true;

    function log(msg) {
      var ts = new Date().toLocaleTimeString();
      console.log("[sophie]", msg);
      if (logEl) {
        logEl.textContent += "[" + ts + "] " + msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }
    }

    function showError(msg) {
      errBar.textContent = msg;
      errBar.classList.add("show");
      setTimeout(function () { errBar.classList.remove("show"); }, 6000);
      log("ERR: " + msg);
    }

    function startTimer() {
      startedAtMs = Date.now();
      timerIntervalId = setInterval(function () {
        var e = Math.floor((Date.now() - startedAtMs) / 1000);
        timerEl.textContent =
          String(Math.floor(e / 60)).padStart(2, "0") + ":" +
          String(e % 60).padStart(2, "0");
      }, 1000);
    }

    function stopTimer() {
      if (timerIntervalId) {
        clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
      startedAtMs = 0;
      timerEl.textContent = "00:00";
    }

    infoBtn.addEventListener("click", function () {
      logEl.classList.toggle("open");
    });

    function tryWake() { lifecycle.wake(); }

    shell.addEventListener("click", function (e) {
      var s = lifecycle.state;
      if (s === "hibernate" || s === "semi-idle") {
        if (e.target.closest(".action-btn") || e.target === infoBtn) return;
        tryWake();
      }
    });

    window.__sophieMarkVoice = function () { lifecycle.markVoice(); };
    window.__sophieMarkFace = function () { lifecycle.markFace(); };
    window.__sophieWake = tryWake;

    startBtn.addEventListener("click", function () {
      startConversation().catch(function (err) {
        log("start err: " + (err && err.message));
        showError("啟動失敗 · " + (err && err.message ? err.message : ""));
      });
    });

    async function startConversation() {
      if (lifecycle.state !== "pre-call") return;
      startBtn.disabled = true;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: camOn ? { width: 640, height: 480 } : false
        });
        log("user media OK");

        peerConn = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });

        // v0.7.1 hotfix: 顯式 audio transceiver sendrecv,
        // 確保 OpenAI SDP answer 含 m=audio 並回傳 audio track
        peerConn.addTransceiver("audio", { direction: "sendrecv" });

        peerConn.ontrack = function (ev) {
          log("ontrack kind=" + ev.track.kind + " streams=" + (ev.streams && ev.streams.length));
          if (ev.track.kind === "audio") {
            try {
              liveAudio.srcObject = ev.streams[0];
              // v0.7.1 hotfix: explicit play() 配合 user gesture
              // (startBtn click 已是 user gesture)
              var pp = liveAudio.play();
              if (pp && pp.then) {
                pp.then(function () { log("liveAudio.play() OK"); })
                  .catch(function (err) { log("liveAudio.play() FAIL: " + err.message); showError("音訊播放被擋,請點畫面任意位置一次"); });
              }
              ev.track.onunmute = function () { log("audio track unmuted"); };
              ev.track.onended = function () { log("audio track ended"); };
            } catch (e) {
              log("ontrack attach err: " + e.message);
            }
          }
        };

        peerConn.addEventListener("connectionstatechange", function () {
          log("pc state: " + peerConn.connectionState);
        });
        peerConn.addEventListener("iceconnectionstatechange", function () {
          log("ice state: " + peerConn.iceConnectionState);
        });

        localStream.getAudioTracks().forEach(function (t) {
          peerConn.addTrack(t, localStream);
        });

        var dc = peerConn.createDataChannel("oai-events");
        dc.addEventListener("open", function () {
          log("dc open · 注入 session.update (instructions + turn_detection)");
          // v0.7.1 hotfix: 把 instructions 注入,否則蘇菲不知道要講中文
          // (從 SDP response header x-realtime-instructions-b64 取)
          var instructions = window.__sophieInstructions ||
            "You are Sophie, Edward's warm Mandarin companion. Always respond in Traditional Chinese (zh-TW). Keep replies short and conversational.";
          try {
            // v0.7.1 hotfix #3: OpenAI Realtime API GA v1 schema (verified 2026-05-23)
            // - session.type="realtime" required
            // - turn_detection moved to session.audio.input.turn_detection
            // - voice moved to session.audio.output.voice
            // - input_audio_transcription -> session.audio.input.transcription
            dc.send(JSON.stringify({
              type: "session.update",
              session: {
                type: "realtime",
                instructions: instructions,
                audio: {
                  input: {
                    transcription: { model: "whisper-1" },
                    turn_detection: {
                      type: "server_vad",
                      threshold: 0.5,
                      prefix_padding_ms: 300,
                      silence_duration_ms: 800,
                      create_response: true
                    }
                  },
                  output: { voice: "marin" }
                }
              }
            }));
            log("session.update sent (instr len=" + instructions.length + ")");
          } catch (e) {
            log("session.update send fail: " + e.message);
          }
        });
        dc.addEventListener("error", function (ev) {
          log("dc error: " + (ev.error ? ev.error.message : "unknown"));
        });
        dc.addEventListener("close", function () {
          log("dc closed");
        });
        dc.addEventListener("message", function (ev) {
          try {
            var data = JSON.parse(ev.data);
            if (data.type === "response.audio.delta" ||
                data.type === "response.audio_transcript.delta") {
              lifecycle.markVoice();
            } else if (data.type === "error") {
              log("OAI error: " + JSON.stringify(data.error || data).slice(0, 300));
              showError("OpenAI: " + (data.error && data.error.message ? data.error.message : "未知錯誤"));
            } else if (data.type === "session.created" || data.type === "session.updated" ||
                       data.type === "response.created" || data.type === "response.done") {
              log("OAI evt: " + data.type);
            }
          } catch (e) {}
        });

        var offer = await peerConn.createOffer();
        await peerConn.setLocalDescription(offer);
        log("offer created (sdp len=" + offer.sdp.length + ")");

        var resp = await fetch("/sdp?persona=sophie&model=gpt-realtime-2", {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: offer.sdp
        });
        if (!resp.ok) {
          var errText = await resp.text();
          throw new Error("SDP backend " + resp.status + ": " + errText.slice(0, 200));
        }
        // v0.7.1 hotfix: 從 SDP response header 取 instructions (base64),
        // dc.open 時注入給 OpenAI
        var instrB64 = resp.headers.get("x-realtime-instructions-b64");
        if (instrB64) {
          try {
            window.__sophieInstructions = decodeURIComponent(escape(atob(instrB64)));
            log("instructions loaded from header (len=" + window.__sophieInstructions.length + ")");
          } catch (e) {
            log("instructions decode fail: " + e.message);
          }
        }
        var answerSdp = await resp.text();
        await peerConn.setRemoteDescription({ type: "answer", sdp: answerSdp });
        log("SDP exchange OK (answer len=" + answerSdp.length + ")");

        startSophieVideoLoop();

        lifecycle.startCall();
        lifecycle.markVoice();
        startBtn.disabled = false;
      } catch (e) {
        startBtn.disabled = false;
        throw e;
      }
    }

    // Phase 7b downgrade demo: MuseTalk batch render ~10x realtime delay on A10G,
    // true realtime streaming requires v1.0 + multi-GPU or v1.5 + A100 + bs=8
    // (deferred to Phase 7c). Drop-in: play Phase 7a sophie-poc.mp4 (5s clip,
    // lipsync self-score 3.75/5) on loop while OpenAI realtime handles actual audio
    // conversation. Watermark discloses this in the UI.
    function startSophieVideoLoop() {
      try {
        liveVideo.src = "/static/sophie-poc-loop.mp4";
        liveVideo.muted = true;
        liveVideo.loop = true;
        liveVideo.playsInline = true;
        var p = liveVideo.play();
        if (p && p.catch) p.catch(function (err) { log("video play warn: " + err.message); });
        if (liveVideo.readyState >= 2) {
          shell.setAttribute("data-stream-ready", "1");
          log("sophie loop ready (instant cached)");
        } else {
          liveVideo.addEventListener("loadeddata", function onReady() {
            shell.setAttribute("data-stream-ready", "1");
            log("sophie loop ready (loadeddata)");
            liveVideo.removeEventListener("loadeddata", onReady);
          });
        }
      } catch (e) {
        log("sophie loop fail: " + e.message);
      }
    }

    function stopSophieVideoLoop() {
      try {
        liveVideo.pause();
        liveVideo.removeAttribute("src");
        liveVideo.load();
      } catch (e) {}
      shell.setAttribute("data-stream-ready", "0");
    }

    endBtn.addEventListener("click", function () { endConversation(); });

    function endConversation() {
      log("end · cleanup");
      stopSophieVideoLoop();
      if (peerConn) {
        try { peerConn.close(); } catch (e) {}
        peerConn = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
        localStream = null;
      }
      liveVideo.srcObject = null;
      liveAudio.srcObject = null;
      shell.setAttribute("data-stream-ready", "0");
      lifecycle.endCall();
    }

    micBtn.addEventListener("click", function () {
      micOn = !micOn;
      if (localStream) {
        localStream.getAudioTracks().forEach(function (t) { t.enabled = micOn; });
      }
      micBtn.classList.toggle("off", !micOn);
      micBtn.setAttribute("aria-pressed", String(micOn));
      micBtn.textContent = micOn ? "🎙" : "🔇";
      log("mic " + (micOn ? "on" : "off"));
    });

    camBtn.addEventListener("click", function () {
      camOn = !camOn;
      if (localStream) {
        localStream.getVideoTracks().forEach(function (t) { t.enabled = camOn; });
      }
      camBtn.classList.toggle("off", !camOn);
      camBtn.setAttribute("aria-pressed", String(camOn));
      camBtn.textContent = camOn ? "📷" : "🚫";
      log("cam " + (camOn ? "on" : "off"));
    });

    pipBtn.addEventListener("click", async function () {
      if (!document.pictureInPictureEnabled) {
        showError("此瀏覽器不支援 PIP");
        return;
      }
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await liveVideo.requestPictureInPicture();
        }
      } catch (e) {
        showError("PIP 啟動失敗 · " + e.message);
      }
    });
    liveVideo.addEventListener("leavepictureinpicture", function () {
      log("PIP closed");
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        var s = lifecycle.state;
        if (s === "in-call" || s === "soft-prompt") endConversation();
      }
    });

    window.addEventListener("beforeunload", function () {
      if (peerConn) {
        try { endConversation(); } catch (e) {}
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/static/sw.js", { scope: "/static/" })
          .then(function () { log("sw registered"); })
          .catch(function (err) { log("sw fail: " + err.message); });
      });
    }

    log("Voice Path v0.7.1 hotfix ready · audio transceiver + instructions inject + 9:16 mobile fullscreen + explicit play()");

    window.__sophie = {
      lifecycle: lifecycle,
      setState: function (s) { lifecycle.transitionTo(s); },
      log: log
    };
  })();
  </script>

</body>
</html>
