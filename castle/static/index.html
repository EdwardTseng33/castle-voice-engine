<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>蘇菲 · v0.5.0</title>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <style>
    :root {
      --amber: #D4712A;
      --amber-deep: #A4571F;
      --amber-bright: #FFB570;
      --green: #1fa66e;
      --green-deep: #15875a;
      --err: #e3392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Source Han Serif TC", "Noto Serif TC", serif;
      color: white;
    }

    .shell {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a120c 0%, #050302 70%);
      display: flex;
      flex-direction: column;
    }
    .shell.active { background: #000; }

    /* === Top overlay === */
    .top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 22px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }
    .name-block {
      display: flex; align-items: center; gap: 10px;
      pointer-events: auto;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }
    .name { font-style: italic; font-size: 18px; color: rgba(255,255,255,0.95); letter-spacing: 0.3px; }
    .info-dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.45);
      color: rgba(255,255,255,0.7);
      font-size: 11px; font-family: Georgia, serif; font-style: normal;
      display: inline-flex; align-items: center; justify-content: center; cursor: help;
    }
    .top-right { display: flex; gap: 10px; pointer-events: auto; }
    .settings-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85); font-size: 18px; cursor: pointer;
      transition: background 0.15s;
    }
    .settings-btn:hover { background: rgba(255,255,255,0.16); }

    /* === Center === */
    .center {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Idle: orb + greeting + green start button */
    .idle-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 0 24px;
      text-align: center;
    }
    .shell.active .idle-block { display: none; }

    @keyframes orb-pulse {
      0%, 100% { transform: scale(1); opacity: 0.92; box-shadow: 0 0 60px rgba(212,113,42,0.35); }
      50%      { transform: scale(1.06); opacity: 1;    box-shadow: 0 0 90px rgba(212,113,42,0.55); }
    }
    .orb {
      width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, var(--amber-bright), var(--amber) 55%, var(--amber-deep) 100%);
      animation: orb-pulse 2.8s ease-in-out infinite;
    }
    .greeting {
      font-style: italic;
      font-size: 26px;
      color: rgba(255,255,255,0.94);
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      max-width: 600px;
      line-height: 1.45;
    }
    .lead {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      max-width: 520px;
    }
    .start-btn {
      padding: 16px 38px;
      border-radius: 999px;
      border: 0;
      background: var(--green);
      color: white;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(31, 166, 110, 0.45);
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .start-btn:hover {
      background: var(--green-deep);
      transform: translateY(-1px);
      box-shadow: 0 10px 32px rgba(31, 166, 110, 0.55);
    }
    .start-btn:active { transform: scale(0.97); }
    .start-btn:disabled {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.45);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Loading overlay (while joining) */
    .loading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.78);
      font-size: 15px;
      font-style: italic;
    }
    .loading.show { display: flex; }
    .loading .orb { width: 100px; height: 100px; animation-duration: 1.6s; }

    /* Active: video element fills center */
    .tavus-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: none;
    }
    .shell.active .tavus-video { display: block; }

    /* Error */
    .error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      max-width: 540px;
      background: rgba(212,113,42,0.1);
      border: 1px solid rgba(212,113,42,0.35);
      border-radius: 10px;
      margin-top: 16px;
    }
    .error.show { display: flex; }
    .error-title { font-style: italic; font-size: 16px; color: rgba(255,255,255,0.92); }
    .error-detail { font-size: 12px; color: rgba(255,180,112,0.85); line-height: 1.55; text-align: center; }

    /* === Bottom overlay === */
    .bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }
    .timer {
      color: rgba(255,255,255,0.88);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, "Cascadia Code", monospace;
      pointer-events: auto;
      min-width: 60px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .shell.active .timer { opacity: 1; }

    .actions {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .icon-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 0;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.15s;
      backdrop-filter: blur(8px);
    }
    .shell.active .icon-btn { display: inline-flex; }
    .icon-btn:hover { background: rgba(255,255,255,0.22); }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn.on { background: var(--amber); }
    .icon-btn.muted { background: rgba(227,57,43,0.32); }
    .icon-btn.end {
      background: var(--err);
      box-shadow: 0 4px 18px rgba(227,57,43,0.45);
    }
    .icon-btn.end:hover { background: #c12d22; }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .watermark {
      color: rgba(255,255,255,0.32);
      font-size: 11px;
      letter-spacing: 0.5px;
      pointer-events: auto;
      min-width: 60px;
      text-align: right;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }

    /* === Settings panel === */
    .panel {
      position: absolute;
      top: 0; right: 0;
      width: 320px;
      height: 100%;
      background: rgba(20, 14, 8, 0.96);
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 64px 24px 24px;
      transform: translateX(100%);
      transition: transform 0.25s;
      z-index: 50;
      overflow-y: auto;
    }
    .panel.open { transform: translateX(0); }
    .panel h3 {
      font-style: italic;
      font-size: 18px;
      color: var(--amber-bright);
      margin-bottom: 18px;
      font-weight: normal;
    }
    .privacy-note {
      font-size: 12px;
      color: rgba(255,180,112,0.85);
      line-height: 1.7;
      padding: 14px;
      background: rgba(212,113,42,0.12);
      border: 1px solid rgba(212,113,42,0.32);
      border-radius: 8px;
    }
    .panel-close {
      position: absolute;
      top: 16px; right: 16px;
      width: 30px; height: 30px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      font-size: 18px;
    }
    .panel-close:hover { background: rgba(255,255,255,0.18); }
    .log-toggle {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.62);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      margin-top: 18px;
    }
    .log {
      margin-top: 12px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.6);
      color: #d4c4a8;
      font-family: ui-monospace, monospace;
      font-size: 10px;
      border-radius: 6px;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }
    .log.open { display: block; }

    @media (max-width: 767px) {
      .orb { width: 140px; height: 140px; }
      .greeting { font-size: 22px; }
      .top, .bottom { padding: 16px 18px; }
      .icon-btn { width: 50px; height: 50px; font-size: 18px; }
      .start-btn { font-size: 15px; padding: 14px 28px; }
      .panel { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="shell" id="shell">

    <div class="top">
      <div class="name-block">
        <span class="name">蘇菲</span>
        <span class="info-dot" title="Voice Path v0.5.0 · 真人視訊對話 · 不錄影 · 不存盤">i</span>
      </div>
      <div class="top-right">
        <button class="settings-btn" id="settingsBtn" title="設定">⚙</button>
      </div>
    </div>

    <div class="center">
      <video class="tavus-video" id="tavusVideo" autoplay playsinline></video>
      <audio id="tavusAudio" autoplay></audio>

      <div class="idle-block" id="idleBlock">
        <div class="orb"></div>
        <div class="greeting">今天想跟蘇菲聊什麼？</div>
        <p class="lead">按下方按鈕、允許麥克風、講中文就可以</p>
        <button class="start-btn" id="startBtn">
          <span>📞</span>
          <span>開始跟蘇菲對話</span>
        </button>
        <div class="loading" id="loading">
          <div class="orb"></div>
          <div>連上蘇菲中... 通常 3-5 秒</div>
        </div>
        <div class="error" id="errorBox">
          <div class="error-title" id="errorTitle">啟動失敗</div>
          <div class="error-detail" id="errorDetail"></div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="timer" id="timer">00:00</div>
      <div class="actions">
        <button class="icon-btn on" id="micBtn" title="麥克風">🎙</button>
        <button class="icon-btn end" id="endBtn" title="結束對話">✕</button>
      </div>
      <div class="watermark">城堡 · BeyondPath</div>
    </div>

    <div class="panel" id="panel">
      <button class="panel-close" id="panelClose">✕</button>
      <h3>蘇菲 · 設定</h3>
      <div class="privacy-note">
        🔒 鏡頭 / 麥克風只在這頁活著、不存盤、不錄影、不外傳。<br><br>
        對話結束後、雲端不留檔。<br><br>
        Sally 6 歲不會被叫出來——城堡守則寫在後台。
      </div>
      <button class="log-toggle" id="logToggle">▾ 開發者 log</button>
      <div class="log" id="log"></div>
    </div>

  </div>

<script>
(function () {
  const shell = document.getElementById("shell");
  const startBtn = document.getElementById("startBtn");
  const endBtn = document.getElementById("endBtn");
  const micBtn = document.getElementById("micBtn");
  const errorBox = document.getElementById("errorBox");
  const errorTitle = document.getElementById("errorTitle");
  const errorDetail = document.getElementById("errorDetail");
  const idleBlock = document.getElementById("idleBlock");
  const loadingEl = document.getElementById("loading");
  const timerEl = document.getElementById("timer");
  const settingsBtn = document.getElementById("settingsBtn");
  const panel = document.getElementById("panel");
  const panelClose = document.getElementById("panelClose");
  const logEl = document.getElementById("log");
  const logToggle = document.getElementById("logToggle");
  const tavusVideo = document.getElementById("tavusVideo");
  const tavusAudio = document.getElementById("tavusAudio");

  let conversationId = null;
  let callObject = null;
  let startedAt = 0;
  let timerInterval = null;
  let micOn = true;

  function log(msg) {
    const ts = new Date().toLocaleTimeString();
    logEl.textContent += "[" + ts + "] " + msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }
  logToggle.addEventListener("click", () => {
    logEl.classList.toggle("open");
    logToggle.textContent = logEl.classList.contains("open") ? "▴ 折疊 log" : "▾ 開發者 log";
  });
  settingsBtn.addEventListener("click", () => panel.classList.add("open"));
  panelClose.addEventListener("click", () => panel.classList.remove("open"));

  function updateTimer() {
    if (!startedAt) return;
    const e = Math.floor((Date.now() - startedAt) / 1000);
    timerEl.textContent = String(Math.floor(e/60)).padStart(2,"0") + ":" + String(e%60).padStart(2,"0");
  }
  function showError(title, detail) {
    errorTitle.textContent = title;
    errorDetail.textContent = detail || "";
    errorBox.classList.add("show");
    loadingEl.classList.remove("show");
    startBtn.style.display = "";
    startBtn.disabled = false;
  }
  function clearError() { errorBox.classList.remove("show"); }

  function attachTracksToElements(participant) {
    if (!participant || participant.local) return;
    const videoTrack = participant.tracks && participant.tracks.video && participant.tracks.video.persistentTrack;
    const audioTrack = participant.tracks && participant.tracks.audio && participant.tracks.audio.persistentTrack;
    if (videoTrack) {
      tavusVideo.srcObject = new MediaStream([videoTrack]);
      log("video track attached");
    }
    if (audioTrack) {
      tavusAudio.srcObject = new MediaStream([audioTrack]);
      log("audio track attached");
    }
  }

  async function startConversation() {
    if (conversationId) return;
    startBtn.disabled = true;
    startBtn.style.display = "none";
    loadingEl.classList.add("show");
    clearError();
    log("建立對話...");

    let resp, data;
    try {
      resp = await fetch("/tavus/conversation/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ audio_only: false }),
      });
      data = await resp.json();
    } catch (e) {
      showError("連不到伺服器", e.message);
      return;
    }
    if (!resp.ok || !data.ok) {
      showError("啟動失敗", (data && (data.hint || data.detail)) || ("HTTP " + resp.status));
      return;
    }
    conversationId = data.conversation_id;
    log("conversation " + conversationId);

    // === daily-js 直接 join · 跳過 prejoin "Enter your name" UI ===
    if (!window.DailyIframe) {
      showError("daily-js 沒載入", "請檢查網路 / unpkg.com 是否可達");
      return;
    }
    try {
      callObject = window.DailyIframe.createCallObject({
        url: data.conversation_url,
        videoSource: false,  // 用戶不用開鏡頭 (蘇菲只看聲音)
        audioSource: true,
      });

      callObject.on("joined-meeting", (ev) => {
        log("joined-meeting");
        const participants = callObject.participants();
        Object.values(participants).forEach(attachTracksToElements);
        // active state
        shell.classList.add("active");
        loadingEl.classList.remove("show");
        idleBlock.style.display = "none";
        startedAt = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
      });

      callObject.on("participant-joined", (ev) => {
        log("participant-joined: " + (ev.participant && ev.participant.user_name));
        attachTracksToElements(ev.participant);
      });

      callObject.on("participant-updated", (ev) => {
        attachTracksToElements(ev.participant);
      });

      callObject.on("error", (ev) => {
        log("daily error: " + JSON.stringify(ev).slice(0,200));
        showError("對話連線錯誤", (ev && ev.errorMsg) || "未知");
      });

      callObject.on("left-meeting", () => {
        log("left-meeting");
      });

      await callObject.join({ userName: "Edward" });
    } catch (e) {
      log("daily join err: " + e.message);
      showError("無法接通", e.message);
      // 已建立的對話也要 end 避免燒分鐘
      if (conversationId) {
        try { await fetch(`/tavus/conversation/${conversationId}/end`, { method: "POST" }); } catch (_) {}
        conversationId = null;
      }
    }
  }

  async function endConversation() {
    endBtn.disabled = true;
    micBtn.disabled = true;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (callObject) {
      try { await callObject.leave(); } catch (_) {}
      try { callObject.destroy(); } catch (_) {}
      callObject = null;
    }
    if (conversationId) {
      log("結束 " + conversationId);
      try {
        await fetch(`/tavus/conversation/${conversationId}/end`, { method: "POST" });
      } catch (e) { log("end err: " + e.message); }
      conversationId = null;
    }
    tavusVideo.srcObject = null;
    tavusAudio.srcObject = null;
    location.reload();
  }

  function toggleMic() {
    if (!callObject) return;
    micOn = !micOn;
    try { callObject.setLocalAudio(micOn); } catch (_) {}
    micBtn.classList.toggle("on", micOn);
    micBtn.classList.toggle("muted", !micOn);
    micBtn.textContent = micOn ? "🎙" : "🔇";
  }

  startBtn.addEventListener("click", startConversation);
  endBtn.addEventListener("click", endConversation);
  micBtn.addEventListener("click", toggleMic);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (panel.classList.contains("open")) panel.classList.remove("open");
      else if (conversationId) endConversation();
    }
  });

  window.addEventListener("beforeunload", () => {
    if (conversationId) {
      navigator.sendBeacon(`/tavus/conversation/${conversationId}/end`, "");
    }
  });

  log("Voice Path v0.5.0 ready · daily-js callObject 模式 · 跳過 prejoin");
})();
</script>
</body>
</html>
