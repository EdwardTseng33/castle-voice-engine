<!doctype html>
<html><head><meta charset="utf-8"><title>Phase 7a Sophie PoC</title>
<style>body{background:#222;color:#eee;font-family:sans-serif;margin:0;padding:20px}
.box{background:#111;padding:16px;border-radius:8px;display:inline-block}
video{display:block;background:#000;max-width:680px}
.meta{color:#bbb;font-size:13px;margin-top:8px}
.controls{margin:8px 0}
button{padding:6px 12px;margin-right:6px;background:#444;color:#eee;border:1px solid #666;cursor:pointer;border-radius:4px}
#timestamp{font-size:18px;color:#0f0}
</style></head><body>
<div class="box">
<h2 style="margin:0 0 8px 0">Phase 7a Sophie MuseTalk PoC</h2>
<div class="meta">125 frames @ 25fps · 5.0s duration · Sophie portrait + edge-xiaoyu audio</div>
<video id="v" controls src="sophie-poc.mp4"></video>
<div class="controls">
<button onclick="seek(0.5)">Frame @ 0.5s (lip closed)</button>
<button onclick="seek(2.0)">Frame @ 2.0s (mid speech)</button>
<button onclick="seek(4.0)">Frame @ 4.0s (lip open)</button>
<button onclick="document.getElementById(`v`).play()">Play</button>
<button onclick="document.getElementById(`v`).pause()">Pause</button>
</div>
<div id="timestamp">Time: 0.00s</div>
</div>
<script>
const v=document.getElementById("v");
function seek(t){v.pause();v.currentTime=t;}
v.addEventListener("timeupdate",()=>{document.getElementById("timestamp").textContent="Time: "+v.currentTime.toFixed(2)+"s"});
</script>
</body></html>
